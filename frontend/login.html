<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymSystem — Acceso</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="layout">

  <!-- Izquierda 50% -->
  <div class="left-panel">
    <div class="brand">
      <div class="brand-icon">🏋️</div><img class="brand-image" alt="" hidden />
      <span class="brand-name">GYMSYSTEM</span>
    </div>

    <h1 class="hero-title">
      GESTIÓN
      <span>TOTAL</span>
      DEL GYM
    </h1>

    <p class="hero-sub">
      Administrá socios, membresías, clases, rutinas y pagos desde un único sistema centralizado.
    </p>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-number">8</span>
        <span class="stat-label">Módulos</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">REST</span>
        <span class="stat-label">API</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">100%</span>
        <span class="stat-label">Control</span>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Derecha 50% -->
  <div class="right-panel">
    <div class="login-card">

      <div class="card-header">
        <h2>BIENVENIDO</h2>
        <p>Ingresá tus credenciales para acceder al sistema</p>
      </div>

      <div class="field">
        <label>Rol de acceso</label>
        <div class="rol-grid">
          <button class="rol-btn active" data-rol="Admin" onclick="selectRol(this)">
            <span>👑</span>Admin
          </button>
          <button class="rol-btn" data-rol="Profesor" onclick="selectRol(this)">
            <span>🏃</span>Profesor
          </button>
          <button class="rol-btn" data-rol="Recepcion" onclick="selectRol(this)">
            <span>📋</span>Recepción
          </button>
        </div>
      </div>

      <div class="form">
        <div class="field">
          <label>Email</label>
          <div class="input-wrap">
            <span class="input-icon">✉</span>
            <input type="email" id="email" placeholder="usuario@gimnasio.com" autocomplete="email" />
          </div>
        </div>

        <div class="field">
          <label>Contraseña</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input
              type="password" id="password"
              placeholder="••••••••"
              autocomplete="current-password"
              onkeydown="if(event.key==='Enter') submitLogin()"
            />
            <button class="toggle-pass" onclick="togglePassword()" type="button" id="toggleBtn">👁</button>
          </div>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <button class="btn-submit" onclick="submitLogin()" id="submitBtn">
          <span class="btn-text">INGRESAR</span>
          <div class="spinner"></div>
        </button>
      </div>

      <div class="card-footer">
        Sistema de gestión &mdash; <strong id="brandFooter">GymSystem v1.0</strong>
      </div>

    </div>
  </div>

</div>

<script src="js/configuracion.js"></script>
<script src="js/login.js"></script>
</body>
</html>
