<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymSystem — Clases</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/clases.css" />
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-left">
      <button class="btn-menu" onclick="toggleSidebar()" aria-label="Menú">☰</button>
      <div class="logo-icon">🏋️</div>
      <span class="logo-text">GYMSYSTEM</span>
    </div>
    <div class="topbar-right">
      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">A</div>
        <div><div class="user-email" id="userEmail">usuario@gym.com</div><div class="user-rol" id="userRol">Admin</div></div>
      </div>
      <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </div>
  </header>

  <aside class="sidebar">
    <span class="nav-section-title">Principal</span>
    <a class="nav-item" href="index.html"><span class="nav-icon">📊</span> Dashboard</a>
    <span class="nav-section-title">Gestión</span>
    <a class="nav-item" href="socios.html"><span class="nav-icon">👥</span> Socios</a>
    <a class="nav-item" href="membresias.html"><span class="nav-icon">🪪</span> Membresías</a>
    <a class="nav-item" href="pagos.html"><span class="nav-icon">💰</span> Pagos</a>
    <a class="nav-item" href="rentabilidad.html"><span class="nav-icon">📈</span> Rentabilidad</a>
    <a class="nav-item" href="asistencias.html"><span class="nav-icon">✅</span> Asistencias</a>
    <span class="nav-section-title">Clases</span>
    <a class="nav-item active" href="clases.html"><span class="nav-icon">🏃</span> Clases</a>
    <a class="nav-item" href="rutinas.html"><span class="nav-icon">📋</span> Rutinas</a>
    <a class="nav-item" href="ejercicios.html"><span class="nav-icon">💪</span> Ejercicios</a>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <main class="main">
    <div class="page-header">
      <div>
        <h1 class="page-title">CLASES</h1>
        <p class="page-sub">Horarios y capacidad por día de la semana</p>
      </div>
      <button class="btn-primary" onclick="abrirModal()">+ NUEVA CLASE</button>
    </div>

    <div class="stats-row">
      <div class="mini-stat"><span class="mini-stat-icon">🏃</span><div><div class="mini-stat-val" id="statTotal">—</div><div class="mini-stat-label">Total clases</div></div></div>
      <div class="mini-stat"><span class="mini-stat-icon">✅</span><div><div class="mini-stat-val" id="statActivas">—</div><div class="mini-stat-label">Activas</div></div></div>
      <div class="mini-stat"><span class="mini-stat-icon">👥</span><div><div class="mini-stat-val" id="statCapacidad">—</div><div class="mini-stat-label">Capacidad total</div></div></div>
      <div class="mini-stat"><span class="mini-stat-icon">📅</span><div><div class="mini-stat-val" id="statHoy">—</div><div class="mini-stat-label">Clases hoy</div></div></div>
    </div>

    <div class="dias-tabs" id="diasTabs"></div>
    <div class="clases-grid" id="clasesGrid">
      <div class="skeleton" style="height:200px"></div>
      <div class="skeleton" style="height:200px"></div>
      <div class="skeleton" style="height:200px"></div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="cerrarModalSiOverlay(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">NUEVA CLASE</span>
      <button class="modal-close" onclick="cerrarModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="field">
          <label>Tipo de entrenamiento *</label>
          <select id="fTipo">
            <option value="">Seleccioná...</option>
            <option value="1">Musculación</option>
            <option value="2">Cardio</option>
            <option value="3">CrossFit</option>
            <option value="4">Funcional</option>
            <option value="5">Yoga</option>
            <option value="6">Pilates</option>
            <option value="7">Spinning</option>
          </select>
        </div>
        <div class="field">
          <label>Profesor *</label>
          <select id="fProfesor"><option value="">Cargando...</option></select>
        </div>
      </div>
      <div class="form-row single">
        <div class="field">
          <label>Día de la semana *</label>
          <select id="fDia">
            <option value="">Seleccioná el día...</option>
            <option>Lunes</option><option>Martes</option><option>Miércoles</option>
            <option>Jueves</option><option>Viernes</option><option>Sábado</option><option>Domingo</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Hora inicio *</label>
          <input type="time" id="fHoraInicio" />
        </div>
        <div class="field">
          <label>Hora fin *</label>
          <input type="time" id="fHoraFin" />
        </div>
      </div>
      <div class="form-row single">
        <div class="field">
          <label>Capacidad máxima *</label>
          <input type="number" id="fCapacidad" placeholder="20" min="1" max="200" />
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-save" id="btnGuardar" onclick="guardarClase()">GUARDAR</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastIcon">✅</span><span id="toastMsg"></span></div>

  <script src="../js/auth.js"></script>
  <script src="../js/pages/clases.js"></script>
</body>
</html>
